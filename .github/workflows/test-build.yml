name: Test build

# Build de test signé par la clé plateforme, SANS publication dans les Releases.
# Les APK sortent en artifacts du run (onglet Actions → run → section Artifacts).
# L'OTA interroge /releases/latest, qui ignore artifacts, drafts et prereleases :
# ce workflow ne peut donc PAS perturber les mises à jour des utilisateurs.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante à construire"
        type: choice
        options: [both, online, offline]
        default: both
      build_type:
        description: "Type de build"
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MG4_KEYSTORE_BASE64: ${{ secrets.MG4_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        if: ${{ env.MG4_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$MG4_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/platform.keystore"
          if [ "$(head -c1 "$RUNNER_TEMP/platform.keystore" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "::error::MG4_KEYSTORE_BASE64 est invalide. Recréer le secret avec : base64 -w0 platform.keystore"
            exit 1
          fi
          echo "MG4_KEYSTORE=$RUNNER_TEMP/platform.keystore" >> "$GITHUB_ENV"

      - name: Build APK(s)
        env:
          MG4_KEYSTORE_PASSWORD: ${{ secrets.MG4_KEYSTORE_PASSWORD }}
          MG4_KEY_ALIAS: ${{ secrets.MG4_KEY_ALIAS }}
          MG4_KEY_PASSWORD: ${{ secrets.MG4_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # "release" → assembleOnlineRelease ; "debug" → assembleOnlineDebug
          case "${{ inputs.build_type }}" in
            release) SUFFIX="Release" ;;
            debug)   SUFFIX="Debug" ;;
          esac
          case "${{ inputs.variant }}" in
            both)    TASKS="assembleOnline$SUFFIX assembleOffline$SUFFIX" ;;
            online)  TASKS="assembleOnline$SUFFIX" ;;
            offline) TASKS="assembleOffline$SUFFIX" ;;
          esac
          echo "Tâches : $TASKS"
          ./gradlew $TASKS --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      # Affiche les schémas de signature réellement posés (v1 / v2 / v3) et l'empreinte du
      # certificat. Permet de contrôler ce que produit VRAIMENT la CI, sans installer l'APK.
      - name: Signature report
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner : $APKSIGNER"
          for f in dist/*.apk; do
            echo "── $(basename "$f") ──"
            "$APKSIGNER" verify --print-certs -v "$f" 2>&1 \
              | grep -E 'Verified using v[0-9]|certificate SHA-256 digest' || echo "  (non vérifiable)"
            echo
          done

      - name: Upload APKs (artifacts, PAS une release)
        uses: actions/upload-artifact@v4
        with:
          name: mg4control-test-${{ inputs.variant }}-${{ inputs.build_type }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
